services:

  db:
    image: mysql:8.0
    container_name: kampung-merak-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kampung_merak
      MYSQL_DATABASE: kampung_merak
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pkampung_merak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./fastapi-backend
    container_name: kampung-merak-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./fastapi-backend/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: kampung_merak
      MYSQL_DATABASE: kampung_merak
    ports:
      - "8000:8000"

  cctv:
    build: ./server
    container_name: kampung-merak-cctv
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      INCUBATOR_RTSP_URL: ${INCUBATOR_RTSP_URL:-rtsp://admin:Admin123@192.168.110.227:554/V_ENC_000}
      KANDANG_RTSP_URL: ${KANDANG_RTSP_URL:-rtsp://admin:Admin123@192.168.110.227:554/V_ENC_000}

volumes:
  mysql_data:
