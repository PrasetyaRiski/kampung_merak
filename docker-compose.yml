version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kampung-merak-frontend
    ports:
      - "8087:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "cctv-gateway:127.0.0.1"
    restart: always
    environment:
      - NODE_ENV=production
