server {
    listen 80;
    server_name localhost;

    # Kompresi Gzip - mempercepat loading 3-5x lipat
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache aset statis (CSS, JS, gambar) selama 1 tahun
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Jangan cache index.html agar update langsung terasa
        add_header Cache-Control "no-cache";
    }

    # Proxy untuk menghindari CORS di Production (sama seperti vite.config.js)
    location /api/ {
    proxy_pass http://kampung-merak-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://kampung-merak-api:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /video_feed {
        proxy_pass http://host.docker.internal:5000/video_feed;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
    }
 
    location /kandang_feed {
        proxy_pass http://host.docker.internal:5000/kandang_feed;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
    }

    location /cctv_health {
        proxy_pass http://host.docker.internal:5000/health;
        proxy_set_header Host $host;
    }
}
