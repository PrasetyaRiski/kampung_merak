server {
    listen 80;
    server_name localhost;

    # Kompresi Gzip - mempercepat loading 3-5x lipat
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache aset statis (CSS, JS, gambar) selama 1 tahun
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Jangan cache index.html agar update langsung terasa
        add_header Cache-Control "no-cache";
    }

    # Proxy untuk menghindari CORS di Production (sama seperti vite.config.js)
    location /api/ {
        proxy_pass https://api-merak.abdulrosyid.my.id/api/;
        proxy_ssl_server_name on;
    }

    location /auth/ {
        proxy_pass https://api-merak.abdulrosyid.my.id/auth/;
        proxy_ssl_server_name on;
    }

    # Proxy untuk MJPEG Kamera CCTV ke Gateway Python lokal
    location /video_feed {
        proxy_pass http://127.0.0.1:5000/video_feed;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
